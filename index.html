<style>
/* VOICE: ruhig, präzise, wie ein gut geführtes Kassabuch einer Treuhänderin.
   IDEA: das Jahresdossier – pro Steuerjahr eine Mappe mit Konten, Belegen, Haus.
   PICTURE: die Kennzahl Nettovermögen auf gelbem Feld, darunter Kostenbalken nach Kategorie.
   COLOUR and TYPE: Weiss, Tinte #101418, Gelb #ffd84a nur hinter der Kennzahl, Schiefer; Manrope.
   LAYOUT: Kennzahl zuerst, Tabellen folgen; Navigation als wrapping Reiter, Jahr rechts. */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#101418);--ink:light-dark(#101418,#e9ecef);--mut:light-dark(#5b6672,#9aa5b1);--line:light-dark(#e3e6ea,#262d35);--soft:light-dark(#f4f6f8,#171d23);--y:#ffd84a;--yi:#101418;--neg:light-dark(#b42318,#ff8a7a);--pos:light-dark(#0f6b3a,#6fd39b);--acc:light-dark(#2f4a63,#8fb3d4)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Manrope,system-ui,sans-serif;overflow-x:clip}
.band{padding:clamp(20px,3vw,40px) max(5vw,16px);max-width:1240px;margin:0 auto}
header{border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.hd{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;max-width:1240px;margin:0 auto;padding:12px max(5vw,16px)}
.hd h1{font-size:18px;margin:0;font-weight:800;margin-inline-end:auto}
nav{display:flex;flex-wrap:wrap;gap:4px}

nav a.on{background:var(--ink);color:var(--bg)}
select,input,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:44px;width:100%}
button{font:inherit;font-weight:700;font-size:15px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:8px;padding:10px 16px;min-height:44px;cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
button.link{background:none;border:0;color:var(--acc);padding:6px 4px;min-height:auto;font-weight:600}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
h2{font-size:clamp(26px,3.4vw,36px);line-height:1.05;margin:0 0 6px;text-wrap:balance}
h3{font-size:19px;margin:28px 0 10px}
.mut{color:var(--mut);font-size:14px}
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:stretch}
.slab{background:var(--y);color:var(--yi);border-radius:14px;padding:24px 26px;display:flex;flex-direction:column;justify-content:space-between;min-height:220px}
.slab .big{font-size:clamp(40px,6vw,64px);font-weight:800;line-height:1;letter-spacing:-.02em;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi b{display:block;font-size:24px;white-space:nowrap}
.bars{display:grid;gap:8px;margin-top:8px}
.bar{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px}
.bar i{display:block;height:14px;border-radius:4px;background:var(--acc)}
.bar span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:13px;color:var(--mut);font-weight:600;border-bottom:1px solid var(--line);padding:8px 6px}
td{border-bottom:1px solid var(--line);padding:9px 6px;vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}tr.click:hover{background:var(--soft)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--soft);white-space:nowrap}
.tag.p{background:#ffe9a8;color:#5a4300}.tag.b{background:#d7f0e0;color:#0f4d2c}.tag.o{background:#fde0dc;color:#7a1d12}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:14px 0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.card{border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.sum td{font-weight:800;border-top:2px solid var(--ink)}
dialog{border:0;border-radius:14px;padding:0;width:min(560px,94vw);background:var(--bg);color:var(--ink);box-shadow:0 20px 60px #0006}
dialog::backdrop{background:#0008}
dialog form{padding:20px;display:grid;gap:12px;max-height:85vh;overflow:auto}
label{display:grid;gap:4px;font-size:14px;font-weight:600}
.note{background:var(--soft);border-radius:10px;padding:12px 14px;font-size:14px}
.empty{padding:30px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:12px}
#msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}
#msg.on{opacity:1}
@media(prefers-reduced-motion:reduce){#msg{transition:none}}
pre,.scroll{overflow-x:auto}
@media(max-width:700px){.hero{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--mut)}.stack td:empty{display:none}.bar{grid-template-columns:minmax(0,7em) minmax(0,1fr) auto}}

.sync{font-size:12px;font-weight:700;border:1px solid var(--line);border-radius:99px;padding:4px 10px;cursor:pointer;white-space:nowrap;color:var(--mut)}
.sync.ok{color:var(--pos)}.sync.fehler{color:var(--neg);border-color:var(--neg)}.sync.login{color:var(--acc);border-color:var(--acc)}
#bnav{display:none}
.mbars{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;height:170px;align-items:end}.mb{display:flex;flex-direction:column;align-items:center;height:100%}.mbp{flex:1;width:100%;display:flex;gap:2px;align-items:flex-end;justify-content:center}.mbp i{display:block;width:42%;border-radius:4px 4px 0 0;min-height:1px}.mb span{font-size:11px;color:var(--mut);margin-top:4px}
i.e{background:var(--mut)}i.a{background:var(--acc)}.legend{display:flex;gap:16px;font-size:13px;margin-top:8px;flex-wrap:wrap}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.bar1{position:relative;height:10px;background:var(--soft);border-radius:4px}.bar1 s{position:absolute;top:-3px;width:2px;height:16px;background:var(--ink)}.krow{padding:10px 0;border-bottom:1px solid var(--line)}.krow:last-child{border:0}.kt{display:flex;justify-content:space-between;margin-bottom:5px}.ks{font-size:13px;margin-top:4px}.neg{color:var(--neg)}.bar1 i{display:block;height:100%;background:var(--acc);border-radius:4px}
svg.prj{width:100%;max-width:760px;height:auto;font-size:11px;display:block}svg.prj text{fill:var(--mut)}svg.prj .grid{stroke:var(--line)}svg.prj .zero{stroke:var(--mut)}svg.prj .la{fill:none;stroke:var(--acc);stroke-width:2.5}svg.prj .lb{fill:none;stroke:var(--mut);stroke-width:2.5;stroke-dasharray:6 4}svg.prj circle{stroke:var(--bg);stroke-width:2}svg.prj .da{fill:var(--acc)}svg.prj .db{fill:var(--mut)}
.legend i.la{background:var(--acc)}.legend i.lb{background:var(--mut)}.tag.neg{color:var(--neg)}td.neg{color:var(--neg)}
.shot.sm{min-height:72px;font-size:15px}.thumbs{display:flex;flex-wrap:wrap;gap:8px}.th{position:relative;width:76px;height:76px;border-radius:10px;overflow:hidden;background:var(--soft);display:flex;align-items:center;justify-content:center;font-weight:700}.th img{width:100%;height:100%;object-fit:cover}.th button{position:absolute;top:2px;right:2px;min-height:0;width:24px;height:24px;padding:0;border-radius:12px;background:#000a;color:#fff;font-size:15px;line-height:24px}
.chk{display:flex;gap:10px;align-items:center}.chk input{width:auto;min-height:auto}details.man{margin-top:18px}details.man>summary{cursor:pointer;font-weight:700;padding:10px 0}
.btnl{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 12px;color:var(--ink);text-decoration:none;font-weight:600}
.arow{display:block;padding:11px 4px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none}.arow:last-child{border-bottom:0}
details.hb{margin-top:10px}details.hb>summary{cursor:pointer;padding:4px 0}.hbt h4{margin:14px 0 4px}.hbt h5{margin:10px 0 4px}.hbt ul{margin:4px 0 8px;padding-left:20px}.hbt li.sub{margin-left:18px}.hbt p{margin:6px 0}

.cap{display:grid;gap:12px;max-width:560px}.shot{display:flex;align-items:center;justify-content:center;min-height:110px;border:2px dashed var(--line);border-radius:14px;font-weight:700;font-size:17px;cursor:pointer;background:var(--soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}.chip{background:var(--bg);color:var(--ink);border:1px solid var(--line);font-weight:600;padding:8px 12px;min-height:40px}.chip.on{background:var(--ink);color:var(--bg)}
.lbl{font-size:14px;font-weight:600}.big{min-height:54px;font-size:17px}.grid2c{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#more{position:fixed;inset:0;background:#0007;z-index:20;display:none}#more.on{display:block}#more div{position:absolute;bottom:0;left:0;right:0;background:var(--bg);border-radius:16px 16px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));display:grid;gap:4px}
#more a{padding:14px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:700}#more a.on{background:var(--soft)}
@media(max-width:760px){header nav{display:none}.hd h1{font-size:16px}
#bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--line);z-index:10;padding-bottom:env(safe-area-inset-bottom)}
#bnav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;font-size:11px;font-weight:700;color:var(--mut);text-decoration:none;min-height:56px;justify-content:center}#bnav a.on{color:var(--ink);background:none}#bnav a.plus span:first-child{background:var(--y);color:var(--yi);border-radius:12px;width:44px;height:30px;display:flex;align-items:center;justify-content:center;font-size:22px}
#bnav span:first-child{font-size:20px;line-height:1}main.band{padding-bottom:96px}}
@media print{header,#bnav,.noprint,#msg{display:none!important}.band{padding:0}body{font-size:12px}}
</style><script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script></head>
<body>
<header><div class="hd">
<h1>Familienfinanzen Gerber</h1>
<nav id="nav"></nav>
<span id="sync" class="sync" role="button" tabindex="0">…</span>
<select id="year" aria-label="Steuerjahr" style="width:auto"></select>
</div></header>
<main id="main" class="band"><p class="mut" id="status">Daten werden geladen …</p></main>
<nav id="bnav" aria-label="Hauptnavigation"></nav><div id="more"><div id="morein"></div></div>
<dialog id="dlg"><form id="frm" method="dialog"></form></dialog>
<div id="msg" role="status"></div>
<script>
{
const VIEWS=[['uebersicht','Übersicht'],['erfassen','Erfassen'],['buchungen','Buchungen'],['budget','Budget'],['ausgaben','Ausgaben'],['projektion','Projektion'],['konten','Konten'],['vorsorge','Vorsorge'],['haus','Haus'],['archiv','Archiv'],['handbuch','Handbuch'],['projekte','Projekte'],['steuern','Steuern'],['versicherungen','Versicherungen'],['anteile','Finanzierung Haus'],['einstellungen','Einstellungen']];
const MAX3A={2020:6826,2021:6883,2022:6883,2023:7056,2024:7056,2025:7258,2026:7258};
const PSTAT=['Idee','Offerten einholen','Geplant','In Arbeit','Erledigt','Verworfen'];
const PSTEU=['Unterhalt (abziehbar)','Wertvermehrend (Anlagekosten)','Gemischt','Zu klären','Nicht abziehbar'];
const DEF_REGELN=`kaminfeger = Haus / Unterhalt\ngemeinde lützelflüh|gemeindeverwaltung lützelflüh = Haus / Grundgebühren\ngebäudeversicherung|gvb = Haus / Versicherung\nbauhaus|jumbo|hornbach|landi|obi|lerchholz = Haus / Unterhalt\njenni energietechnik = Haus / Unterhalt\nhypothekarzins|zinsabschluss hypothek = Haus / Hypothekarzins\namortisation = Haus / Amortisation\nviac|finpension|frankly = Lukas / Säule 3a\ncss|helsana|swica|sanitas|visana|concordia|kpt|assura|groupe mutuel|ökk|atupri = Haushalt / Krankenkasse\nsteuerverwaltung|steuerrechnung = Haushalt / Steuern\nlohn|salär|gehalt = Gemeinsam / Einkommen`;
const KAT=['Anlagekosten','Wertvermehrend','Unterhalt','Hypothekarzins','Amortisation','Versicherung','Grundgebühren','Liegenschaftssteuer','Gebühren & Steuern','Säule 3a','Einkommen','Familienzulagen','Lebenshaltung','Krankenkasse','Krankheitskosten','Kinderbetreuung','Berufsauslagen','Spenden','Steuern','Sonstiges'];
const STATUS=['Bezahlt','Offen','Geplant','Gestundet','Zu prüfen'];
const KTYP=['Privatkonto','Sparkonto','Liegenschaftskonto','Depot','Anteilschein','Säule 3a','Pensionskasse','Hypothek'];
const VTYP=['Gebäude','Hausrat/Haftpflicht','Rechtsschutz','Krankenkasse','Leben/Risiko','Auto','Sonstige'];
const S={tx:[],acc:[],ins:[],proj:[],bud:[],wis:[],ums:[],ere:[],tomb:{},haus:{},set:{personen:['Lukas','Annika']},ok:false};
let view='uebersicht',dlgSave=null;
let Y=new Date().getFullYear();
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const chf=v=>(v==null||v===''||isNaN(v))?'–':Number(v).toLocaleString('de-CH',{minimumFractionDigits:2,maximumFractionDigits:2});
const chf0=v=>Number(v||0).toLocaleString('de-CH',{maximumFractionDigits:0});
const dt=d=>d?d.split('-').reverse().join('.'):'–';
const sum=(a,f)=>a.reduce((s,x)=>s+(+f(x)||0),0);
const msg=t=>{const m=$('#msg');m.textContent=t;m.classList.add('on');setTimeout(()=>m.classList.remove('on'),2200)};
const bereiche=()=>['Haus','Haushalt',...(S.set.personen||[]),...(S.set.kinder||[]).map(k=>k.name).filter(Boolean),'Gemeinsam'];
const tag=s=>`<span class="tag ${s==='Bezahlt'?'b':s==='Zu prüfen'?'p':s==='Offen'?'o':''}">${esc(s)}</span>`;
const abz=t=>t.abziehbar??t.betrag;
const txY=y=>S.tx.filter(t=>+t.steuerjahr===y);
const saldo=(a,y)=>a.saldi?.[y];

function nav(){$('#nav').innerHTML=VIEWS.filter(v=>v[0]!=='erfassen').map(([k,l])=>`<a href="#${k}" class="${k===view?'on':''}">${l}</a>`).join('')+`<a href="#erfassen" class="${view==='erfassen'?'on':''}">+ Beleg</a>`;
const B=[['uebersicht','⌂','Übersicht'],['buchungen','≡','Buchungen'],['erfassen','+','Beleg'],['steuern','§','Steuern']];const main=B.some(b=>b[0]===view);
$('#bnav').innerHTML=B.map(([k,i,l])=>`<a href="#${k}" class="${k===view?'on':''} ${k==='erfassen'?'plus':''}"><span>${i}</span><span>${l}</span></a>`).join('')+`<a href="#" id="morebtn" class="${main?'':'on'}"><span>⋯</span><span>Mehr</span></a>`;
$('#morein').innerHTML=VIEWS.filter(v=>!B.some(b=>b[0]===v[0])).map(([k,l])=>`<a href="#${k}" class="${k===view?'on':''}">${l}</a>`).join('');
$('#morebtn').onclick=e=>{e.preventDefault();$('#more').classList.add('on')};$('#more').onclick=()=>$('#more').classList.remove('on');}
function years(){const ys=new Set([new Date().getFullYear(),Y]);S.tx.forEach(t=>t.steuerjahr&&ys.add(+t.steuerjahr));S.acc.forEach(a=>Object.keys(a.saldi||{}).forEach(k=>ys.add(+k)));
const lo=Math.min(...ys),hi=Math.max(...ys,new Date().getFullYear()+1);for(let y=lo;y<=hi;y++)ys.add(y);$('#year').innerHTML=[...ys].sort((a,b)=>b-a).map(y=>`<option ${y===Y?'selected':''}>${y}</option>`).join('');}

function render(){nav();years();const m=$('#main');if(!S.ok){return}
m.innerHTML=({uebersicht:vUeb,erfassen:vErfassen,buchungen:vBuch,budget:vBudget,konten:vKonten,vorsorge:vVorsorge,haus:vHaus,projekte:vProj,steuern:vSteuern,versicherungen:vVers,anteile:vAnteile,einstellungen:vEinst,archiv:vArchiv,handbuch:vHandbuch,ausgaben:vAusgaben,projektion:vProjektion}[view]||vUeb)();bind();setSync();}

function tax(y){const T=txY(y);
const guth=S.acc.filter(a=>!['Hypothek','Säule 3a','Pensionskasse'].includes(a.typ)&&saldo(a,y)!=null);
const hyp=S.acc.filter(a=>a.typ==='Hypothek');
const zinsTx=sum(T.filter(t=>t.kategorie==='Hypothekarzins'&&t.status==='Bezahlt'),t=>t.betrag);
const zinsAcc=sum(hyp,a=>a.zinsen?.[y]);
const H=T.filter(t=>t.bereich==='Haus'),HB=H.filter(t=>t.status==='Bezahlt'),k=c=>sum(HB.filter(t=>t.kategorie===c),abz);
const uh=k('Unterhalt'),vers=k('Versicherung'),gg=k('Grundgebühren'),lst=k('Liegenschaftssteuer'),uhB=uh+vers+gg;
const uhP=sum(H.filter(t=>t.status==='Zu prüfen'&&['Unterhalt','Versicherung','Grundgebühren'].includes(t.kategorie)),abz);
const emw=+(S.haus.emwJahre?.[y]??S.haus.eigenmietwert)||0,emwB=+(S.haus.emwBundJahre?.[y]??S.haus.eigenmietwertBund)||0,pPct=S.haus.ueber10?0.2:0.1;
const s3a=T.filter(t=>t.kategorie==='Säule 3a');
return{T,guth,hyp,verm:sum(guth,a=>saldo(a,y)),ertrag:sum(guth,a=>a.zinsen?.[y]),schuld:sum(hyp,a=>saldo(a,y)),zins:zinsAcc||zinsTx,uh,vers,gg,lst,uhB,uhP,emw,emwB,pausch:emw*pPct,pauschB:emwB*pPct,pPct,s3a}}

function vUeb(){const t=tax(Y),netto=t.verm-t.schuld,T=t.T;
const haus=T.filter(x=>x.bereich==='Haus'&&x.kategorie!=='Anlagekosten');const by={};haus.forEach(x=>by[x.kategorie]=(by[x.kategorie]||0)+(+x.betrag||0));
const ent=Object.entries(by).sort((a,b)=>b[1]-a[1]),mx=Math.max(1,...ent.map(e=>e[1]));
const pr=S.tx.filter(x=>x.status==='Zu prüfen').sort((a,b)=>(b.betrag||0)-(a.betrag||0));
const fr=(S.haus.fristen||[]).filter(f=>f.datum>=new Date().toISOString().slice(0,10)).sort((a,b)=>a.datum<b.datum?-1:1).slice(0,4);
const today=new Date().toISOString().slice(0,10),lim=new Date(Date.now()+60*864e5).toISOString().slice(0,10),due=(S.haus.fristen||[]).filter(f=>f.datum<=lim&&f.datum>=today).sort((a,b)=>a.datum<b.datum?-1:1);
return `${due.length?`<div class="note" style="background:#fff3c4;color:#4a3b00;margin-bottom:16px"><b>Bald fällig:</b> ${due.map(f=>`${dt(f.datum)} – ${esc(f.text)}`).join('<br>')}</div>`:''}<h2>Finanzen ${Y} auf einen Blick</h2><p class="mut">Stand der erfassten Saldi per 31.12.${Y}. Hypothek als Schuld abgezogen; 3a und Pensionskasse nicht enthalten.</p>
<div class="hero"><div class="slab"><div><div style="font-weight:700">Nettovermögen 31.12.${Y}</div><div class="mut" style="color:#3b3300">Guthaben ${chf0(t.verm)} − Hypothek ${chf0(t.schuld)}</div></div><div class="big">CHF ${chf0(netto)}</div></div>
<div class="kpis"><div class="kpi"><span class="mut">Hypothek</span><b>${chf0(t.schuld)}</b></div><div class="kpi"><span class="mut">Schuldzinsen ${Y}</span><b>${chf(t.zins)}</b></div>

function checks(y){const t=tax(y),c=[];
t.T.filter(x=>x.status==='Zu prüfen').forEach(x=>c.push(['Buchung zu prüfen',x.text+(x.firma?' · '+x.firma:''),x.betrag,x._id]));
t.T.filter(x=>x.status==='Offen').forEach(x=>c.push(['Zahlung offen',x.text,x.betrag,x._id]));
t.T.filter(x=>x.bereich==='Haus'&&x.status==='Bezahlt'&&['Unterhalt','Versicherung','Grundgebühren','Liegenschaftssteuer'].includes(x.kategorie)&&abz(x)>0&&!x.beleg&&!x.belege?.length).forEach(x=>c.push(['Beleg fehlt',x.text,abz(x),x._id]));
S.acc.filter(a=>!['Pensionskasse','Säule 3a'].includes(a.typ)&&saldo(a,y)==null).forEach(a=>c.push(['Saldo 31.12. fehlt',a.name+' ('+(a.bank||'')+')',null,null,a._id]));
if(!t.emw)c.push(['Eigenmietwert Kanton fehlt','unter Haus erfassen',null]);if(!t.emwB)c.push(['Eigenmietwert Bund fehlt','unter Haus erfassen',null]);
return c}

function taxP(y,p){const t=tax(y),h=.5,f=a=>a.inhaber==='Gemeinsam'?h:1;
const own=S.acc.filter(a=>!['Hypothek','Säule 3a','Pensionskasse'].includes(a.typ)&&saldo(a,y)!=null&&(a.inhaber===p||a.inhaber==='Gemeinsam'));
return{own,f,verm:sum(own,a=>saldo(a,y)*f(a)),ertrag:sum(own,a=>(a.zinsen?.[y]||0)*f(a)),schuld:t.schuld*h,zins:t.zins*h,uh:t.uh*h,vers:t.vers*h,gg:t.gg*h,uhB:t.uhB*h,lst:t.lst*h,emw:t.emw*h,emwB:t.emwB*h,pausch:t.pausch*h,pauschB:t.pauschB*h,pPct:t.pPct,
s3a:sum(txY(y).filter(x=>x.kategorie==='Säule 3a'&&x.bereich===p&&x.status==='Bezahlt'),x=>x.betrag),kap:txY(y).filter(x=>x.kapital&&x.bereich===p)}}

${P.map(p=>{const t=taxP(Y,p),best=Math.max(t.uhB,t.pausch),bestB=Math.max(t.uhB,t.pauschB);return `<h2 style="margin-top:34px;font-size:26px">${esc(p)}</h2>

/* CSV-Import */
const parseRegeln=t=>String(t||'').split('\n').map(l=>{const m=l.split('=');if(m.length<2)return null;const[b,k]=m.slice(1).join('=').split('/').map(x=>x.trim());return{m:m[0].trim().toLowerCase().split('|').map(x=>x.trim()).filter(Boolean),b,k}}).filter(r=>r&&r.m.length&&r.b&&r.k);
function num(v){v=String(v??'').replace(/['’\s]/g,'').replace(/CHF/i,'');if(!v)return null;if(/,\d{1,2}$/.test(v)&&!/\.\d/.test(v))v=v.replace(/\./g,'').replace(',','.');else v=v.replace(/,/g,'');const n=parseFloat(v);return isNaN(n)?null:n}
function pdate(v){v=String(v||'').trim();let m=v.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[0];m=v.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{2,4})/);if(m){const y=m[3].length===2?'20'+m[3]:m[3];return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`}return null}
function splitCsv(line,dl){const o=[];let c='',q=false;for(let i=0;i<line.length;i++){const ch=line[i];if(q){if(ch==='"'&&line[i+1]==='"'){c+='"';i++}else if(ch==='"')q=false;else c+=ch}else if(ch==='"')q=true;else if(ch===dl){o.push(c);c=''}else c+=ch}o.push(c);return o.map(x=>x.trim())}
function parseCsv(txt){const L=txt.replace(/^﻿/,'').split(/\r?\n/).filter(l=>l.trim());if(!L.length)return[];
const dl=[';',',','\t'].sort((a,b)=>L.slice(0,10).join('').split(b).length-L.slice(0,10).join('').split(a).length)[0];
let hi=L.findIndex(l=>/datum|date|valuta|buchungstag/i.test(l)&&/betrag|amount|belastung|gutschrift|debit|credit/i.test(l));if(hi<0)return[];
const H=splitCsv(L[hi],dl).map(h=>h.toLowerCase()),f=re=>H.findIndex(h=>re.test(h));
const iD=f(/buchungsdatum|^datum|date|buchungstag|valuta/),iA=f(/^betrag|amount|betrag/),iS=f(/belastung|debit|soll|lastschrift/),iH=f(/gutschrift|credit|haben/);
const iT=H.map((h,i)=>/text|beschreibung|description|empfänger|auftraggeber|mitteilung|details|zahlungszweck|payee|merchant|name/.test(h)?i:-1).filter(i=>i>=0);
return L.slice(hi+1).map(l=>{const c=splitCsv(l,dl),datum=pdate(c[iD]);let b=iA>=0?num(c[iA]):null;
if(b==null){const s=iS>=0?num(c[iS]):null,h=iH>=0?num(c[iH]):null;b=s?-Math.abs(s):h?Math.abs(h):null}
return datum&&b!=null&&b!==0?{datum,betrag:b,text:[...new Set(iT.map(i=>c[i]).filter(Boolean))].join(' · ').slice(0,160)}:null}).filter(Boolean)}

/* ===== Lokale Datenhaltung (IndexedDB) ===== */
const COLS={tx:'tx',accounts:'acc',insurances:'ins',projekte:'proj',budget:'bud',wissen:'wis',umsaetze:'ums',ereignisse:'ere'};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
let IDB=null;
function idb(){return IDB||(IDB=new Promise((res,rej)=>{const r=indexedDB.open('familienfinanzen',1);r.onupgradeneeded=()=>{r.result.createObjectStore('kv');r.result.createObjectStore('files')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))}
async function kv(store,key,val){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction(store,val===undefined?'readonly':'readwrite'),s=t.objectStore(store);const q=val===undefined?s.get(key):val===null?s.delete(key):s.put(val,key);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function kvKeys(store){const d=await idb();return new Promise((res,rej)=>{const q=d.transaction(store).objectStore(store).getAllKeys();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
function snapshot(){const o={v:2,tomb:S.tomb||{},haus:S.haus,settings:S.set};for(const[c,k]of Object.entries(COLS))o[c]=S[k];return o}
function loadSnap(o){for(const[c,k]of Object.entries(COLS))S[k]=o?.[c]||[];S.haus=o?.haus||{};S.set=o?.settings||{personen:['Lukas','Annika']};S.tomb=o?.tomb||{}}
let saveT=null;
async function persist(){await kv('kv','data',snapshot());await kv('kv','dirty',true);clearTimeout(saveT);saveT=setTimeout(()=>sync(false),2500);setSync()}
async function put(col,id,o,keepTs){id=id||uid();const k=COLS[col];const rec={...clean(o),_id:id,updatedAt:keepTs&&o.updatedAt?o.updatedAt:Date.now()};
const i=S[k].findIndex(x=>x._id===id);if(i>=0)S[k][i]=rec;else S[k].push(rec);await persist();render();return id}

const LOCALURL={};
async function shrink(file){if(!file.type.startsWith('image/')||file.size<600000)return file;
try{const bmp=await createImageBitmap(file);const k=Math.min(1,2000/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
const b=await new Promise(res=>c.toBlob(res,'image/jpeg',0.8));if(!b||b.size>=file.size)return file;return new File([b],file.name.replace(/\.[^.]+$/,'')+'.jpg',{type:'image/jpeg'})}catch(_){return file}}

get folder(){return localStorage.getItem('ff_folder')||''},get file(){return localStorage.getItem('ff_file')||''},get belege(){return localStorage.getItem('ff_belege')||''},get backups(){return localStorage.getItem('ff_backups')||''}};
let TOKEN=null,TOKEN_EXP=0,tokenClient=null,SYNC={state:'lokal',last:null,err:''};
function setCfg(k,v){if(v)localStorage.setItem('ff_'+k,v);else localStorage.removeItem('ff_'+k)}
function gisReady(){return !!(window.google&&google.accounts&&google.accounts.oauth2)}
function getToken(interactive){return new Promise((res,rej)=>{
if(!TOKEN){try{const t=JSON.parse(sessionStorage.getItem('ff_tok')||'null');if(t&&Date.now()<t.exp-60000){TOKEN=t.tok;TOKEN_EXP=t.exp}}catch(_){}}
if(TOKEN&&Date.now()<TOKEN_EXP-60000)return res(TOKEN);
if(!interactive)return rej(new Error('LOGIN'));
if(!CFG.clientId)return rej(new Error('Keine Google Client-ID eingetragen'));if(!gisReady())return rej(new Error('Google-Anmeldung nicht geladen (offline?)'));
tokenClient=google.accounts.oauth2.initTokenClient({client_id:CFG.clientId,scope:SCOPE,callback:r=>{if(r.error)return rej(new Error(r.error));TOKEN=r.access_token;TOKEN_EXP=Date.now()+(r.expires_in||3600)*1000;try{sessionStorage.setItem('ff_tok',JSON.stringify({tok:TOKEN,exp:TOKEN_EXP}))}catch(_){}localStorage.setItem('ff_signed','1');res(TOKEN)},error_callback:e=>rej(new Error(e.type==='popup_closed'?'Anmeldung abgebrochen':e.type||'Anmeldung fehlgeschlagen'))});
tokenClient.requestAccessToken({prompt:localStorage.getItem('ff_signed')?'':'consent'})})}
async function gapi(path,opt={},interactive){const t=await getToken(interactive);const r=await fetch(path.startsWith('http')?path:API+path,{...opt,headers:{Authorization:'Bearer '+t,...(opt.headers||{})}});
if(r.status===401){TOKEN=null;sessionStorage.removeItem('ff_tok');throw new Error('LOGIN')}if(!r.ok)throw new Error('Drive '+r.status+': '+(await r.text()).slice(0,160));return r}
const q=s=>encodeURIComponent(s);
async function dFind(qs){const r=await gapi(`/files?q=${q(qs)}&fields=files(id,name,parents,modifiedTime,owners(displayName))&supportsAllDrives=true&includeItemsFromAllDrives=true&pageSize=50`);return (await r.json()).files||[]}
async function dFolder(name,parent){const ex=await dFind(`name='${name}' and mimeType='application/vnd.google-apps.folder' and trashed=false`+(parent?` and '${parent}' in parents`:''));if(ex.length)return ex[0].id;
const r=await gapi('/files?fields=id&supportsAllDrives=true',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,mimeType:'application/vnd.google-apps.folder',parents:parent?[parent]:undefined})});return (await r.json()).id}
async function dUpload(meta,blob,id){const fd=new FormData();fd.append('metadata',new Blob([JSON.stringify(meta)],{type:'application/json'}));fd.append('file',blob);
const r=await gapi(`${UP}/files${id?'/'+id:''}?uploadType=multipart&fields=id,version,webViewLink&supportsAllDrives=true`,{method:id?'PATCH':'POST',body:fd});return r.json()}

const ex=await dFind(`name='daten.json' and '${root}' in parents and trashed=false`);let fid=ex[0]?.id;
if(!fid){const f=await dUpload({name:'daten.json',parents:[root],mimeType:'application/json'},new Blob([JSON.stringify(snapshot())],{type:'application/json'}));fid=f.id}
setCfg('folder',root);setCfg('file',fid);setCfg('belege',bel);setCfg('backups',bak);await sync(true);msg('Mit Google Drive verbunden')}

function mergeData(a,b){const out={v:2,tomb:{}};for(const c of Object.keys(COLS)){const T={...(a.tomb?.[c]||{})};for(const[i,t]of Object.entries(b.tomb?.[c]||{}))T[i]=Math.max(T[i]||0,t);out.tomb[c]=T;
const m=new Map();for(const r of[...(a[c]||[]),...(b[c]||[])]){const o=m.get(r._id);if(!o||(r.updatedAt||0)>(o.updatedAt||0))m.set(r._id,r)}
out[c]=[...m.values()].filter(r=>!(T[r._id]&&T[r._id]>=(r.updatedAt||0)))}
for(const k of['haus','settings'])out[k]=((a[k]?.updatedAt||0)>=(b[k]?.updatedAt||0)?a[k]:b[k])||a[k]||b[k]||{};return out}
let syncing=false;
async function uploadPending(){const keys=(await kvKeys('files')).filter(k=>String(k).startsWith('local:'));let n=0;
for(const key of keys){const f=await kv('files',key);if(!f)continue;const nm=(f.name||'beleg').replace(/[\\/:*?"<>|]+/g,'_');
const yearF=await dFolder(String(new Date().getFullYear()),CFG.belege);const r=await dUpload({name:nm,parents:[yearF]},f.blob);await dLock(r.id,'Beleg – nicht ändern');
for(const k of Object.values(COLS))for(const rec of S[k])if(rec.belege?.some(b=>b.id===key)){rec.belege=rec.belege.map(b=>b.id===key?{id:r.id,name:b.name,link:r.webViewLink}:b);rec.updatedAt=Date.now()}
await kv('files',key,null);n++}
if(n){await kv('kv','data',snapshot());await kv('kv','dirty',true)}return n}
async function dLock(id,reason){try{await gapi(`/files/${id}?supportsAllDrives=true`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({contentRestrictions:[{readOnly:true,reason}]})})}catch(_){}}
async function processImports(data){let imp=localStorage.getItem('ff_import');if(!imp){imp=await dFolder('Import',CFG.folder);localStorage.setItem('ff_import',imp)}
const L=(await dFind(`'${imp}' in parents and trashed=false and mimeType!='application/vnd.google-apps.folder'`)).filter(f=>/\.json$/i.test(f.name));if(!L.length)return[data,0];
const done=await dFolder('erledigt',imp);let n=0;
for(const f of L){try{const j=await (await gapi(`/files/${f.id}?alt=media&supportsAllDrives=true`)).json();if(j.app!=='Familienfinanzen Gerber'&&!j.v)continue;
for(const c of Object.keys(COLS))j[c]=j[c]||[];j.tomb=j.tomb||{};data=mergeData(data,j);n++;
await gapi(`/files/${f.id}?addParents=${done}&removeParents=${imp}&supportsAllDrives=true`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:'{}'})}catch(e){console.warn('Import',f.name,e)}}
return[data,n]}
async function dailyBackup(data){const d=new Date().toISOString().slice(0,10);if(localStorage.getItem('ff_lastbak')===d||!CFG.backups)return;
const ex=await dFind(`name='daten_${d}.json' and '${CFG.backups}' in parents and trashed=false`);if(!ex.length){const b=await dUpload({name:`daten_${d}.json`,parents:[CFG.backups]},new Blob([JSON.stringify(data)],{type:'application/json'}));await dLock(b.id,'Automatisches Backup – nicht ändern')}localStorage.setItem('ff_lastbak',d)}
async function sync(interactive){if(syncing||!CFG.file)return;if(!navigator.onLine){SYNC.state='offline';setSync();return}syncing=true;SYNC.state='sync';setSync();
try{await uploadPending();await uploadEingang();const meta=await (await gapi(`/files/${CFG.file}?fields=version,modifiedTime&supportsAllDrives=true`,{},interactive)).json();
const lastV=await kv('kv','remoteVersion'),dirty=await kv('kv','dirty');let data=snapshot();
if(meta.version!==lastV){const remote=await (await gapi(`/files/${CFG.file}?alt=media&supportsAllDrives=true`)).json();data=mergeData(data,remote);loadSnap(data);await kv('kv','data',data)}
let nImp=0;try{[data,nImp]=await processImports(data)}catch(e){console.warn(e)}if(nImp){loadSnap(data);await kv('kv','data',data);await kv('kv','dirty',true);msg(nImp+' Import(e) aus Drive übernommen')}
if(dirty||nImp||meta.version!==lastV){const r=await dUpload({},new Blob([JSON.stringify(data)],{type:'application/json'}),CFG.file);await kv('kv','remoteVersion',r.version);await kv('kv','dirty',false)}
await dailyBackup(data);SYNC={state:'ok',last:new Date(),err:''};render()}
catch(e){SYNC=e.message==='LOGIN'?{state:'login',last:SYNC.last,err:''}:{state:'fehler',last:SYNC.last,err:e.message||String(e)}}finally{syncing=false;setSync()}}

<div class="row" style="justify-content:space-between;margin-top:16px"><h3 style="margin:0">Geplante Ereignisse</h3><button id="newere">Ereignis hinzufügen</button></div>
${E.length?`<table class="stack"><thead><tr><th>Ereignis</th><th>Zeitraum</th><th>Variante</th><th class="n">CHF</th></tr></thead><tbody>${E.map(e=>`<tr class="click" data-ere="${esc(e._id)}"><td>${esc(e.name)}<div class="mut">${esc(e.art||'')}${e.notiz?' · '+esc(e.notiz):''}</div></td><td>${e.von?mName(e.von):'ab jetzt'}${e.art==='Einmalig'?'':e.bis?' – '+mName(e.bis):' – offen'}</td><td>${esc(e.variante&&e.variante!=='beide'?e.variante:'beide')}</td>${(()=>{const v=(e.art==='Ausgabe'?-1:1)*(+e.betrag||0);return `<td class="n ${v<0?'neg':''}">${v<0?'−':'+'}${chf0(Math.abs(v))}${e.art==='Einmalig'?'':' /Mt'}</td>`})()}</tr>`).join('')}</tbody></table>`:`<div class="empty">Noch keine Ereignisse. Beispiele: Mutterschaftsurlaub, Pensum-Reduktion, Kita, Familienzulagen, Sanierung (einmalig), Hypothek-Aufstockung, Wegfall Eigenmietwert 2029.</div>`}
<details class="card" style="margin-top:12px"><summary><b>Jahreswerte als Tabelle</b></summary><table><thead><tr><th>Ende</th><th class="n">${B?'A':'Freie Mittel'}</th>${B?'<th class="n">B</th>':''}</tr></thead><tbody>${yrRows.map(([p,q])=>`<tr><td>${p===A[0]?'heute':ymS(p[0]).slice(0,4)}</td><td class="n">${chf0(p[1])}</td>${B?`<td class="n">${chf0(q?.[1])}</td>`:''}</tr>`).join('')}</tbody></table></details>`}
function ereForm(e){e=e||{art:'Ausgabe',variante:'beide'};form(e._id?'Ereignis bearbeiten':'Neues Ereignis',[['name','Bezeichnung (z. B. Kita, Mutterschaft)'],['art','Art','select',[['Ausgabe','Mehrausgabe pro Monat'],['Einnahme','Mehreinnahme pro Monat (negativ = weniger Lohn)'],['Einmalig','Einmaliger Betrag (negativ = Ausgabe)']]],['betrag','Betrag CHF','number'],['von','Ab (Monat)','month'],['bis','Bis (Monat, leer = offen)','month'],['variante','Gilt für','select',[['beide','Beide Varianten'],['A','Nur Variante A'],['B','Nur Variante B']]],['notiz','Notiz','area']],e,o=>put('ereignisse',e._id,{...e,...o}),e._id&&(()=>delDoc('ereignisse',e._id)))}
function bindProjektion(){if(view!=='projektion')return;const m=$('#main');
m.querySelectorAll('[data-pj]').forEach(b=>b.onclick=()=>{PRJ.jahre=+b.dataset.pj;render()});
m.querySelectorAll('[data-ere]').forEach(r=>r.onclick=()=>ereForm(S.ere.find(x=>x._id===r.dataset.ere)));
const n=$('#newere');if(n)n.onclick=()=>ereForm();
const sv=$('#psave');if(sv)sv.onclick=()=>{const g=id=>{const v=$(id).value;return v===''?null:+v};setDoc('settings',{...S.set,proj:{ein:g('#pein'),aus:g('#paus'),start:g('#pstart')}})}}

/* ===== Wer zahlt was ===== */
const payer=t=>{if(t.bezahltVon)return t.bezahltVon;const a=S.acc.find(x=>x._id===t.konto);return a?(a.zahltFuer||a.inhaber||'Unbekannt'):'Unbekannt'};
const FARTEN=['Eigengut (z. B. Erbe, Schenkung)','Erspartes','Vorsorge (3a / Pensionskasse)','Hypothek / Kredit','Sonstiges'];
function vAnteile(){const pers=S.set.personen||[],fp=[...pers,'Gemeinsam'];
const F=S.haus.finanzierung||[],V=S.haus.verwendung||[],EK=F.filter(f=>!/Hypothek/.test(f.art)),FK=F.filter(f=>/Hypothek/.test(f.art));
const fs=(p,L=F)=>sum(L.filter(f=>f.person===p),f=>f.betrag),tot=sum(F,f=>f.betrag),totV=sum(V,v=>v.betrag),ek=sum(EK,f=>f.betrag);
const col={Lukas:'#2f4a63',Annika:'#c2703d',Gemeinsam:'#8a96a3'},cc=p=>col[p]||'#6b8f71';
const bar=(L,total)=>`<div style="display:flex;height:22px;border-radius:6px;overflow:hidden;gap:2px">${L.filter(x=>x[1]>0).map(([p,v])=>`<div title="${esc(p)}: CHF ${chf(v)}" style="flex:${v};background:${cc(p)}"></div>`).join('')}</div><div class="row mut" style="margin-top:4px">${L.filter(x=>x[1]>0).map(([p,v])=>`<span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${cc(p)};margin-right:4px"></span>${esc(p)} ${chf0(v)} (${Math.round(v/total*100)} %)</span>`).join('')}</div>`;
const T=txY(Y).filter(t=>t.status==='Bezahlt'&&!t.kapital&&!/^Transfer\b/i.test(t.text||'')&&!['Einkommen','Familienzulagen'].includes(t.kategorie)&&!(t.kategorie==='Anlagekosten'&&t.betrag>=100000));
const cell=p=>sum(T.filter(t=>payer(t)===p),t=>t.betrag);
return `<div class="row" style="justify-content:space-between"><h2>Finanzierung Hauskauf</h2><div class="row noprint"><button class="ghost" id="finprint">Drucken / PDF</button><button class="ghost" id="newver">Verwendung +</button><button id="newfin">Herkunft +</button></div></div>
<p class="mut">Lehner 1183e, Ranflüh · Eigentum seit ${dt(S.haus.kaufdatum)} · alle Posten mit Beleg (Kontoauszug, Abrechnung). Dokumentation für Güter- und Erbrecht – keine Rechtsberatung.</p>
<div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin:14px 0"><div class="kpi"><span class="mut">Total finanziert</span><b>${chf0(tot)}</b></div><div class="kpi"><span class="mut">Eigenmittel</span><b>${chf0(ek)}</b></div><div class="kpi"><span class="mut">Hypothek</span><b>${chf0(sum(FK,f=>f.betrag))}</b></div></div>
<h3>Eigenmittel nach Person</h3>${bar(fp.map(p=>[p,fs(p,EK)]),ek||1)}
<h3>Herkunft der Mittel</h3>${F.length?`<table class="stack"><thead><tr><th>Datum</th><th>Herkunft</th><th>Art</th>${fp.map(p=>`<th class="n">${esc(p)}</th>`).join('')}</tr></thead><tbody>${F.map((f,i)=>`<tr class="click" data-fin="${i}"><td>${dt(f.datum)}</td><td>${esc(f.text)}<div class="mut">${esc(f.notiz||'')}</div></td><td>${esc(f.art.replace(/ \(.*\)/,''))}</td>${fp.map(p=>`<td class="n">${f.person===p?chf(f.betrag):''}</td>`).join('')}</tr>`).join('')}
<tr class="sum"><td></td><td>Total</td><td></td>${fp.map(p=>`<td class="n">${chf(fs(p))}</td>`).join('')}</tr></tbody></table><p class="mut">Total aller Quellen: CHF ${chf(tot)}</p>`:'<div class="empty">Noch nichts erfasst.</div>'}
<h3>Verwendung der Mittel</h3>${V.length?`<table class="stack"><thead><tr><th>Datum</th><th>Verwendung</th><th class="n">CHF</th></tr></thead><tbody>${V.map((v,i)=>`<tr class="click" data-ver="${i}"><td>${dt(v.datum)}</td><td>${esc(v.text)}<div class="mut">${esc(v.notiz||'')}</div></td><td class="n">${chf(v.betrag)}</td></tr>`).join('')}<tr class="sum"><td></td><td>Total</td><td class="n">${chf(totV)}</td></tr></tbody></table>
${Math.abs(totV-tot)<0.01?'<p class="mut">✓ Herkunft und Verwendung stimmen überein.</p>':`<p class="mut">Differenz Herkunft − Verwendung: CHF ${chf(tot-totV)}</p>`}`:'<p class="mut">Noch keine Verwendung erfasst.</p>'}
<details class="card noprint" style="margin-top:26px;padding:10px 14px"><summary style="cursor:pointer;font-weight:700">Laufende Zahlungen ${Y} nach Konto (Schätzung)</summary><p class="mut">Abgeleitet aus dem Konto bzw. «Bezahlt von» der Buchungen – nicht einzeln belegt.</p><table>${[...fp,'Unbekannt'].map(p=>`<tr><td>${esc(p)}</td><td class="n">${chf(cell(p))}</td></tr>`).join('')}</table></details>`}
function verForm(i){const V=[...(S.haus.verwendung||[])],v=i!=null?V[i]:{};
form(i!=null?'Verwendung bearbeiten':'Verwendung der Mittel',[['datum','Datum','date'],['text','Verwendung'],['betrag','Betrag CHF','number'],['notiz','Notiz / Beleg','area']],v,
o=>{if(i!=null)V[i]={...v,...o};else V.push(o);V.sort((a,b)=>(a.datum||'')<(b.datum||'')?-1:1);return setDoc('haus',{...S.haus,verwendung:V})},i!=null&&(()=>{V.splice(i,1);return setDoc('haus',{...S.haus,verwendung:V})}))}
function finForm(i){const F=[...(S.haus.finanzierung||[])],f=i!=null?F[i]:{art:'Erspartes',person:'Gemeinsam'};
form(i!=null?'Eintrag bearbeiten':'Herkunft der Mittel',[['datum','Datum','date'],['person','Person','select',[...(S.set.personen||[]),'Gemeinsam']],['text','Herkunft (z. B. Erbvorbezug Vater)'],['art','Art','select',FARTEN],['betrag','Betrag CHF','number'],['notiz','Notiz / Beleg','area']],f,
o=>{if(i!=null)F[i]={...f,...o};else F.push(o);F.sort((a,b)=>(a.datum||'')<(b.datum||'')?-1:1);return setDoc('haus',{...S.haus,finanzierung:F})},i!=null&&(()=>{F.splice(i,1);return setDoc('haus',{...S.haus,finanzierung:F})}))}
/* ===== Einstellungen ===== */
function vEinst(){const P=S.set.personen||[],K=S.set.kinder||[];
return `<h2>Einstellungen</h2>
<h3>Google Drive</h3><div class="card">
<p><b>Status:</b> <span id="sync2">${!CFG.file?'Nicht verbunden – Daten nur auf diesem Gerät':SYNC.state==='fehler'?'Fehler: '+esc(SYNC.err):'Verbunden'+(SYNC.last?' · zuletzt '+SYNC.last.toLocaleTimeString('de-CH'):'')}</span></p>
${CFG.clientId?'':`<label>Google Client-ID<input id="cid" placeholder="…apps.googleusercontent.com"></label><button class="ghost" id="cidsave" style="margin:8px 0">Client-ID speichern</button>`}
<div class="row">${CFG.file?`<button id="syncnow">Jetzt synchronisieren</button><button class="ghost" id="drvopen">Ordner in Drive öffnen</button><button class="ghost" id="drvoff">Verbindung trennen</button>`:`<button id="drvnew">Neuen Ordner anlegen (erste Person)</button><button class="ghost" id="drvjoin">Geteilten Ordner verbinden (zweite Person)</button>`}</div>
<p class="mut">Ablauf: Lukas legt den Ordner an und teilt «Familienfinanzen Gerber» in Google Drive mit Annika (Bearbeiter). Annika tippt dann «Geteilten Ordner verbinden». Jeden Tag wird automatisch eine Kopie in «Backups» gespeichert.</p></div>
<h3>Personen</h3><div class="card"><label>Erwachsene (kommagetrennt)<input id="pers" value="${esc(P.join(', '))}"></label>
<label style="margin-top:10px">Heiratsdatum (bis zu diesem Jahr getrennte Steuererklärungen)<input id="heirat" type="date" value="${esc(S.set.heirat||'')}"></label>
<div class="lbl" style="margin-top:10px">Kinder</div>${K.length?`<table>${K.map((k,i)=>`<tr><td>${esc(k.name)}</td><td>${k.geburt?dt(k.geburt):'<span class="mut">Geburt offen</span>'}</td><td><button class="link" data-kidx="${i}">bearbeiten</button></td></tr>`).join('')}</table>`:'<p class="mut">Noch keine Kinder erfasst.</p>'}
<div class="row" style="margin-top:8px"><button class="ghost" id="newkid">Kind hinzufügen</button><button id="perssave">Personen speichern</button></div></div>
<h3>Daten</h3><div class="card row"><button class="ghost" id="bak">Backup herunterladen</button><button class="ghost" id="rest">Backup / Daten importieren</button></div>
<p class="mut">App-Version 1.0 · Daten: lokal auf diesem Gerät${CFG.file?' und in Google Drive':''}.</p>`}
function kidForm(i){const K=[...(S.set.kinder||[])],k=i!=null?K[i]:{};form(i!=null?'Kind bearbeiten':'Kind hinzufügen',[['name','Name (oder Arbeitstitel)'],['geburt','Geburtsdatum','date']],k,
o=>{if(i!=null)K[i]={...k,...o};else K.push(o);return setDoc('settings',{...S.set,kinder:K})},i!=null&&(()=>{K.splice(i,1);return setDoc('settings',{...S.set,kinder:K})}))}
function bindEinst(){const on=(id,f)=>{const e=$(id);if(e)e.onclick=f};const run=f=>async()=>{try{await f()}catch(e){SYNC={state:'fehler',err:e.message};setSync();msg(e.message);render()}};
on('#cidsave',()=>{const v=$('#cid').value.trim();if(v){localStorage.setItem('ff_client',v);msg('Gespeichert');render()}});
on('#drvnew',run(driveSetupNew));on('#drvjoin',run(driveConnectExisting));on('#syncnow',run(()=>sync(true)));
on('#drvopen',()=>window.open('https://drive.google.com/drive/folders/'+CFG.folder,'_blank'));
on('#drvoff',()=>{['folder','file','belege','backups'].forEach(k=>setCfg(k,''));localStorage.removeItem('ff_signed');TOKEN=null;render()});
on('#newkid',()=>kidForm());$('#main').querySelectorAll('[data-kidx]').forEach(b=>b.onclick=()=>kidForm(+b.dataset.kidx));
on('#perssave',()=>setDoc('settings',{...S.set,personen:$('#pers').value.split(',').map(s=>s.trim()).filter(Boolean),heirat:$('#heirat').value}).then(()=>msg('Gespeichert')))}

/* ===== Start ===== */
(async()=>{const st=$('#status');
try{const D=await kv('kv','data');loadSnap(D);if(!D&&!location.hash)location.hash='einstellungen';for(const k of await kvKeys('files')){const f=await kv('files',k);if(f)LOCALURL[k]=URL.createObjectURL(f.blob)}}catch(e){st.textContent='Lokaler Speicher nicht verfügbar: '+e.message;return}
S.ok=true;route();setSync();
const tryAuto=()=>{if(CFG.file&&gisReady())sync(false)};
window.addEventListener('load',()=>setTimeout(tryAuto,800));addEventListener('online',()=>sync(false));
document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync(false)});
$('#sync').onclick=()=>sync(true);
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();

}
</script>
</body>
</html>
